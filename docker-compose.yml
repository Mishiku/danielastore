services:
  frontend:
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: danielastore.duckdns.org
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8080:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      SQLITE_DB_PATH: /data/danielastore.db
      SQLITE_SCHEMA_PATH: /app/db/schema.sql
    volumes:
      - ./db:/app/db:ro
      - ./db/sqlite-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
volumes:
  frontend_node_modules:
  caddy_data:
  caddy_config:
