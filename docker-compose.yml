services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}

    environment:
      NGINX_PORT: 8080
      BACKEND_HOST: backend
      BACKEND_PORT: 3000

    volumes:
      - ${FRONTEND_SRC:-frontend_src}:/app/src
      - ${FRONTEND_ANGULAR_JSON:-frontend_config}:/app/angular.json

    expose:
      - "8080"
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      SQLITE_DB_PATH: /data/danielastore.db
      SQLITE_SCHEMA_PATH: /app/db/schema.sql
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./backend/src:/app/src
      - ./db:/app/db:ro
      - ./db/sqlite-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-danielastore.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
volumes:
  frontend_src:
  frontend_config:
  backend_dev:
  caddy_data:
  caddy_config:
